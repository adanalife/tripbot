version: '3'

# The test targets run in the one-shot `test` service defined in
# infra/docker/docker-compose.testing.yml (layered on the base compose):
# it boots postgres, applies migrations, then runs `go test`. Env vars
# come from .env.testing; module/build caches live in named volumes.

vars:
  # The compose stack the test targets run against — the same base +
  # testing overlay CI uses (infra/docker/docker-compose.testing.yml).
  COMPOSE: >-
    docker compose --project-directory . --env-file infra/docker/env.docker
    -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.testing.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # The test image is a thin layer over the mirrored Go base, so a local copy
  # built months ago still satisfies compose and silently runs an old toolchain
  # against a go.mod that has moved on. Rebuilding with --pull refreshes the
  # base; the version check turns the resulting failure into a legible one.
  test:image:
    desc: Rebuild the test image against the latest mirrored Go base and verify its toolchain satisfies go.mod
    cmds:
      - "{{.COMPOSE}} build --pull test"
      - >-
        {{.COMPOSE}} run --rm --no-deps test bash -c 'want=$(grep -m1 "^go " go.mod | cut -d" " -f2);
        got=$(go version | cut -d" " -f3 | sed "s/^go//");
        printf "%s\n%s\n" "$want" "$got" | sort -V -C ||
        { echo "test image ships Go $got, but go.mod requires >= $want" >&2; exit 1; }'

  test:
    desc: Run all unit tests
    deps: [test:image]
    cmds:
      - "{{.COMPOSE}} run --rm test go test ./..."

  test:cover:
    desc: Run tests with coverage + race detector; prints per-function and total coverage
    deps: [test:image]
    cmds:
      - "{{.COMPOSE}} run --rm test bash -c 'go test -v -race -covermode=atomic -coverprofile=coverage.out ./... && go tool cover -func=coverage.out'"

  test:cover:html:
    desc: Generate HTML coverage report at coverage.html
    deps: [test:image]
    cmds:
      - "{{.COMPOSE}} run --rm test bash -c 'go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html'"
      - 'echo "Open coverage.html in your browser"'

  test:race:
    desc: Run tests with the race detector (slower; surfaces data races)
    deps: [test:image]
    cmds:
      - "{{.COMPOSE}} run --rm test go test -race ./..."

  # The postgres container outlives a `task test` run, and golang-migrate records
  # what it has applied — so editing a migration that already ran leaves the old
  # schema in place and the next run tests against it, passing or failing for
  # reasons the files on disk no longer explain. Recreating the container is what
  # re-applies the whole chain from scratch; the down migration isn't involved,
  # so this also works on a migration whose `down` is itself broken.
  #
  # Only db + migrate go: the module and build caches live in their own named
  # volumes, and dropping those would turn every reset into a full recompile.
  test:db:reset:
    desc: Recreate the test postgres from scratch — run after editing an already-applied migration
    cmds:
      - "{{.COMPOSE}} rm -sf db migrate"
      - 'echo "test database removed; the next task test / test:cover re-migrates from scratch"'

  shell:
    desc: Open an interactive Go-toolchain shell inside the test container
    interactive: true
    deps: [test:image]
    cmds:
      - "{{.COMPOSE}} run --rm test bash"

  # Twitch OAuth consent + token bootstrap is owned by the platform-gateway
  # (gateway-twitch's /auth/* flow writes the oauth_tokens rows), so there's no
  # auth-bootstrap task here: re-auth is a browser click at the gateway consent
  # page (surfaced in tripbot-console).

  # Changelog (towncrier). Fragments live in changelog.d/; assembled into
  # CHANGELOG.md at release time. Run on the host via uvx — no project dep.
  changelog:add:
    desc: 'Scaffold a changelog fragment (TYPE=fix, optional SLUG=my-thing; CI numbers it on push). Pass PR=123 to name it directly. Types: gateway chatbot onscreens playout console fix deploy ci cleanup misc summary'
    vars:
      TYPE: '{{.TYPE | default "misc"}}'
      # No PR yet? Drop a "+" placeholder (towncrier's issue-less convention) —
      # changelog-number.yml renames it to <PR#>.<type>.md once the PR is open.
      NAME: '{{if .PR}}{{.PR}}{{else}}+{{.SLUG | default .TYPE}}{{end}}'
    cmds:
      - uvx towncrier create --config towncrier.toml {{.NAME}}.{{.TYPE}}.md

  changelog:preview:
    desc: Preview the pending changelog from the current fragments (towncrier draft)
    cmds:
      - uvx towncrier build --draft --config towncrier.toml --version {{.VERSION | default "Unreleased"}}

  changelog:build:
    desc: Collate fragments into CHANGELOG.md for a release + delete them (VERSION=3.9.0)
    requires:
      vars: [VERSION]
    cmds:
      - uvx towncrier build --yes --config towncrier.toml --version {{trimPrefix "v" .VERSION}}

  # Release smoke flow.
  # Targets the local k3d cluster running the stage-1 overlay
  # (cloudflared tunnel + apps).

  release:verify-images:
    desc: Verify multi-arch manifests for a release version (VERSION=v2.0.2 or 2.0.2)
    requires:
      vars: [VERSION]
    vars:
      # docker/metadata-action strips the leading "v" — Docker tags are
      # bare semver. Accept either VERSION=v2.0.2 or VERSION=2.0.2.
      TAG: '{{trimPrefix "v" .VERSION}}'
    cmds:
      - docker buildx imagetools inspect adanalife/tripbot:{{.TAG}}
      - docker buildx imagetools inspect adanalife/onscreens-server:{{.TAG}}

  release:smoke:whalecore:
    desc: Smoke-check tripbot.whalecore.com (requires allowlisted IP). Blocks on failure.
    cmds:
      - curl -sfS --max-time 10 https://tripbot.whalecore.com/health/live > /dev/null
      - 'echo "✓ tripbot.whalecore.com/health/live"'

  release:smoke:local:
    desc: Smoke-check in-cluster tripbot health via kubectl port-forward.
    cmds:
      - bin/release-smoke-local

  release:smoke:stage-1:
    desc: Deploy stage-1 to local k3d, wait for rollouts, smoke-test public+local.
    cmds:
      - task -d {{.HOME}}/adanalife/infra k8s-apply-stage-1
      - kubectl rollout status deploy/tripbot     --timeout=120s
      - kubectl rollout status deploy/cloudflared --timeout=60s
      - task: release:smoke:local
      - task: release:smoke:whalecore

  release:smoke:
    desc: Alias for release:smoke:stage-1
    cmds:
      - task: release:smoke:stage-1


  # platforms.json is the fleet-wide supported-platform set, owned by
  # platform-gateway (its Go adapter registry is the source of truth) and synced
  # into every repo — the same sibling-checkout convention the eventbus/contract
  # bridges use. cdk8s reads it into SUPPORTED_PLATFORMS; never hand-edit it here.
  platforms:sync:
    desc: Re-sync platforms.json from the sibling platform-gateway checkout (the source of truth)
    cmds:
      - cp ../platform-gateway/platforms.json platforms.json

  # cdk8s — the Python authoring layer for tripbot's app workload manifests
  # (cdk8s/). Synthesizes dist/<env>-<component>-<platform>.k8s.yaml (+ the
  # per-env identity unit + the one-shot Job files), which Argo delivers
  # cross-repo. The stateful + shared-platform units stay in infra/cdk8s.
  cdk8s:cli:
    desc: Install the pinned cdk8s CLI into cdk8s/node_modules from the committed package-lock.json
    dir: cdk8s
    cmds:
      - mise exec -- npm ci
    # npm ci stamps node_modules/.package-lock.json; skip the reinstall while it
    # is newer than the lockfile it was built from.
    status:
      - test node_modules/.package-lock.json -nt package-lock.json

  cdk8s:imports:
    desc: Generate the typed k8s + ESO constructs (cdk8s import) into cdk8s/imports/ — gitignored, needed before synth/test on a fresh checkout
    dir: cdk8s
    deps: [cdk8s:cli]
    cmds:
      - mise exec -- uv run npx cdk8s import

  cdk8s:synth:
    desc: Synthesize the manifests (offline) -> cdk8s/dist/<env>-<component>-<platform>.k8s.yaml (+ identity / jobs)
    dir: cdk8s
    deps: [cdk8s:imports]
    cmds:
      - mise exec -- uv run npx cdk8s synth
      # prod-1 app manifests are pinned to their release version: frozen here and
      # regenerated only on release-please's release PR, so a chart change on
      # main doesn't reach prod's committed dist until the next release — which
      # is what puts the config delta in the same diff as the version bump.
      # Discard this HEAD re-synth of the pinned app files. Match every prod-1
      # app manifest (all components × all platforms) so a newly-supported
      # platform is frozen like the rest without editing this list; identity +
      # one-shot Jobs carry no per-platform suffix and re-synth normally.
      - |
        pinned=$(git ls-files -- 'dist/prod-1-*.k8s.yaml' | grep -vE 'prod-1-(tripbot-identity|job-)')
        [ -n "$pinned" ] && git checkout -- $pinned || true

  cdk8s:test:
    desc: Run the cdk8s synth-time checks on the committed dist/
    dir: cdk8s
    deps: [cdk8s:imports]
    cmds:
      - mise exec -- uv run pytest -q

  cdk8s:check:
    desc: Golden-file gate — re-synth and fail if cdk8s/dist/ is stale (run cdk8s:synth and commit)
    dir: cdk8s
    cmds:
      - task: cdk8s:synth
      - git diff --exit-code -- dist/ || { echo "dist/ is stale — run task cdk8s:synth and commit"; exit 1; }

  # Schema-validate the committed dist/*.k8s.yaml (what Argo actually applies)
  # against the cluster's k8s API version — catches API-version drift after a
  # k8s bump. dist/apps/*.json is the ApplicationSet discovery index (see
  # main.py), not a manifest, so the glob excludes it. CRD kinds resolve via
  # the datree CRDs-catalog; anything not there is skipped, not failed. The
  # {{`{{.Group}}`}} backtick wrapping keeps kubeconform's URL template out of
  # Task's own templating. Mirrored in cdk8s-synth.yml.
  cdk8s:validate:
    desc: Validate the committed dist/*.k8s.yaml manifests against the k8s API schemas (kubeconform)
    dir: cdk8s
    cmds:
      # -kubernetes-version tracks the live cluster (kubectl version); bump it with talos upgrades
      - mise exec -- kubeconform -strict -summary -kubernetes-version 1.36.0 -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{`{{.Group}}`}}/{{`{{.ResourceKind}}`}}_{{`{{.ResourceAPIVersion}}`}}.json' -ignore-missing-schemas dist/*.k8s.yaml

  cdk8s:verify:
    desc: The cdk8s edit loop in one step — synth, show what changed in dist/, run the synth-time checks
    dir: cdk8s
    cmds:
      - task: cdk8s:synth
      - git status --short -- dist/
      - git diff --stat -- dist/
      - mise exec -- uv run pytest -q

  cdk8s:stage:diff:
    desc: kubectl diff the synthed stage-1 app manifests against the live cluster (read-only)
    dir: cdk8s
    cmds:
      - task: cdk8s:synth
      - for: { var: f, split: "\n" }
        cmd: kubectl diff -f "{{.f}}" || true
        vars:
          f:
            sh: ls dist/stage-1-*.k8s.yaml | grep -v -- '-job-'

  cdk8s:prod:diff:
    desc: kubectl diff the committed (release-pinned) prod-1 app manifests against the live cluster (read-only)
    dir: cdk8s
    cmds:
      - task: cdk8s:synth
      - for: { var: f, split: "\n" }
        cmd: kubectl diff -f "{{.f}}" || true
        vars:
          f:
            sh: ls dist/prod-1-*.k8s.yaml | grep -v -- '-job-'

  cdk8s:prod:bump:
    desc: 'Regenerate one prod-1 component''s pinned manifests after a hand pin edit in versions.yaml (COMPONENT=tripbot|onscreens-server), e.g. a rollback'
    dir: cdk8s
    deps: [cdk8s:imports]
    requires:
      vars: [COMPONENT]
    cmds:
      # Full synth regenerates ALL prod app files from HEAD; freeze every OTHER
      # component back to its own pinned release so only COMPONENT's manifests
      # change (its tag + any config delta this release introduced). DISTNAME
      # strips the -server suffix (onscreens-server -> onscreens); tripbot is
      # unchanged.
      - mise exec -- uv run npx cdk8s synth
      - |
        distname="{{.COMPONENT}}"; distname="${distname%-server}"
        others=$(git ls-files -- 'dist/prod-1-*.k8s.yaml' | grep -vE 'prod-1-(tripbot-identity|job-)' | grep -v "prod-1-${distname}-" || true)
        [ -n "$others" ] && git checkout -- $others || true
