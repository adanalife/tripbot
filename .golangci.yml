# golangci-lint settings only — which linters run is chosen per job by the
# --default=none --enable=... flags in .github/workflows/linting.yml, one job
# per concern so the checks list names which linter found something. Keeping
# selection out of this file matters because config and flags union rather than
# override: an `enable` list here would run revive inside the staticcheck job
# too, and every job posts through the same reviewdog check, so there would be
# no way to tell which one raised a comment.
#
# Run locally with the same version CI pins (see .tool-versions):
#   mise exec -- golangci-lint run --default=none --enable=staticcheck ./...
version: "2"

linters:
  settings:
    staticcheck:
      # golangci-lint's default set minus the ST checks it already excludes,
      # plus QF1001. QF1001 rewrites `!(a && b)` into `!a || !b` via De Morgan's
      # law, which reads worse in the loop guards we use it in
      # (`!(sawMiles && sawGuess)` says "until we've seen both" directly).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
