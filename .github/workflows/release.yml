# Versioned multi-arch release build for the two images built from this repo
# (tripbot, onscreens-server), via the shared build-image.yml reusable
# workflow. Publishes `X.Y.Z` / `vX.Y` / `vX` / `latest` manifest lists (plus
# the per-arch `-amd64`/`-arm64` variants) to Docker Hub.
#
# NOT concurrency-guarded (unlike dev-image.yml): cancelling could drop a
# version, and per-version tags don't race.
name: release
on:
  push:
    tags:
      - v*
  # A manual re-deploy of an existing tag, for when the push-triggered run
  # failed on something outside the code (a registry hiccup, an expired
  # token). Pick the tag as the ref.
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tags: ${{ steps.ver.outputs.tags }}
    steps:
      - name: Resolve version + release tag set
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != v[0-9]* ]]; then
            echo "::error::release must run at a vX.Y.Z tag ref (got '$GITHUB_REF_NAME')"
            exit 1
          fi
          V="${GITHUB_REF_NAME#v}"          # 3.16.0
          MAJOR_MINOR="v${V%.*}"            # v3.16
          MAJOR="v${V%%.*}"                 # v3
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tags=$V $MAJOR_MINOR $MAJOR latest" >> "$GITHUB_OUTPUT"

  tripbot:
    needs: version
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: adanalife/tripbot
      dockerfile: infra/docker/tripbot/Dockerfile
      cache-scope: tripbot
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}

  onscreens-server:
    needs: version
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: adanalife/onscreens-server
      dockerfile: infra/docker/onscreens-server/Dockerfile
      cache-scope: onscreens-server
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}

  notify:
    needs: [tripbot, onscreens-server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only the tag push announces. A workflow_dispatch run re-deploys a tag
      # that already shipped, which is operational rather than news. The alert
      # below stays unconditional: a re-deploy going red is exactly the case
      # worth paging on.
      - name: Discord notification
        if: github.event_name == 'push'
        # A rotated or deleted webhook returns 404 and must not fail a release
        # that already shipped; the notification is best-effort.
        continue-on-error: true
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION_TAG: ${{ github.ref_name }}
        with:
          # Link the tagged CHANGELOG.md, not a payload `compare` URL: one wording
          # fleet-wide, so a release reads the same whichever repo it came from.
          args: 'New release for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}): [{{ VERSION_TAG }}]({{ EVENT_PAYLOAD.repository.html_url }}/blob/{{ VERSION_TAG }}/CHANGELOG.md)'

  # Nothing else says a release went red. The release PR merged green long
  # before the tag ran, so the only record is this run's own entry in a run
  # list nobody is watching.
  #
  # `if: failure()` is what makes this the catch-all: it runs when any job
  # above failed, including when a later one was skipped as a result. `notify`
  # cannot trip it, since continue-on-error keeps a dead webhook out of that
  # job's status.
  #
  # Best-effort like the announcement -- a failure to report a failure should
  # not become a second failure.
  alert:
    needs: [version, tripbot, onscreens-server, notify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Alert Discord on failure
        continue-on-error: true
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          VERSION_TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # Points at the log rather than naming what failed: any job above can
          # be the one, and naming it would go stale as the jobs change.
          args: 'Release failed for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}) at {{ VERSION_TAG }}: [run log]({{ RUN_URL }})'
