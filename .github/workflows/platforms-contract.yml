name: platforms-contract

# Keeps this repo's copy of platforms.json (the fleet-wide platform set, owned
# by platform-gateway's Go adapter registry) in step with the gateway's main,
# through infra's shared contract-sync workflow. A drifted copy becomes a PR on
# `bot/contract-sync`.
#
# The triggers are the point of this workflow: upstream drift lands with no PR
# here to notice it. The owners send `contract-changed` when a push to their
# main touches a contract, and the daily schedule catches a missed dispatch.
# The PR-time checks are steps of the `gates` job in pr-gates.yml.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [contract-changed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platforms-contract:
    uses: adanalife/infra/.github/workflows/contract-sync.yml@main
    with:
      runs-on: ubuntu-latest
      platforms: true
    secrets: inherit
