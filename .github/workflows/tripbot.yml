name: tripbot
on:
  pull_request:
    # Docs/cdk8s/workflow-only PRs don't need a full image build + compose
    # smoke. Push to main stays unfiltered as the post-merge safety net.
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'db/**'
      - 'configs/**'
      - 'assets/**'
      - 'infra/docker/**'
      - '.dockerignore'
      - '.github/workflows/tripbot.yml'
  push:
    branches:
      - main

# Supersede an in-flight run when new commits land on the same PR/branch —
# a superseded build's image is immediately stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job reads no secrets, so it runs identically on a Dependabot PR
    # (which is issued none) as on a push to main. Every image it needs is
    # either built here or mirrored to ghcr, and the smoke test only boots
    # far enough to read /version — so the channel/bot identity is a fixed
    # placeholder rather than the real account.
    env:
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
      CHANNEL_NAME: ci_channel
      BOT_USERNAME: ci_bot

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build tripbot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/tripbot/Dockerfile
          tags: adanalife/tripbot:latest
          load: true
          push: false
          cache-from: type=gha,scope=tripbot
          cache-to: type=gha,mode=max,scope=tripbot

      - name: Bring up db + migrate
        run: |
          docker compose \
            --project-directory . \
            --env-file infra/docker/env.docker \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.testing.yml \
            -f infra/docker/docker-compose.github.yml \
            up -d db migrate

      - run: sleep 5

      - name: Check logs (migrate)
        run: docker logs tripbot-migrate-1

      # tripbot's LoadFromDB at boot refuses to start without an oauth_tokens
      # row (cluster contract: bootstrap-or-fatal). CI has no real Twitch
      # creds to bootstrap with, so seed a syntactically-valid placeholder row
      # so cmd/tripbot can boot far enough to verify version files + /version.
      - name: Seed placeholder oauth_tokens row for build-stack tripbot
        run: |
          docker exec -i tripbot-db-1 \
            psql -U tripbot_docker -d tripbot_docker \
              -v ON_ERROR_STOP=1 \
              -v BOT_USERNAME="$BOT_USERNAME" <<'SQL'
          INSERT INTO oauth_tokens
            (provider, username, access_token, refresh_token, expires_at, scopes)
          VALUES
            ('twitch', :'BOT_USERNAME', 'ci-placeholder-access',
             'ci-placeholder-refresh', NOW() + INTERVAL '1 hour',
             'chat:read chat:edit')
          ON CONFLICT (provider, username) DO UPDATE
            SET access_token = EXCLUDED.access_token,
                refresh_token = EXCLUDED.refresh_token,
                expires_at    = EXCLUDED.expires_at;
          SQL

      - name: Bring up tripbot
        run: |
          docker compose \
            --project-directory . \
            --env-file infra/docker/env.docker \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.testing.yml \
            -f infra/docker/docker-compose.github.yml \
            up -d tripbot

      - run: sleep 10

      - name: Check logs (tripbot)
        run: docker logs tripbot-tripbot-1

      - name: Check running containers
        run: docker ps -a

      - name: Verify version files baked into image
        run: |
          docker exec tripbot-tripbot-1 test -s /etc/tripbot/version
          docker exec tripbot-tripbot-1 test -s /etc/tripbot/sha
          echo "version: $(docker exec tripbot-tripbot-1 cat /etc/tripbot/version)"
          echo "sha:     $(docker exec tripbot-tripbot-1 cat /etc/tripbot/sha)"

      - name: Verify /version HTTP endpoint
        run: |
          docker exec tripbot-tripbot-1 curl -fsS http://localhost:8080/version

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: |
          docker compose \
            --project-directory . \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.testing.yml \
            -f infra/docker/docker-compose.github.yml \
            down
