---
name: super-linter

# Weekly sweep + on-demand, not a per-PR gate: pre-commit and the reviewdog
# linting workflow already cover the per-PR lint surface; super-linter catches
# the long-tail validators on a schedule instead of gating every push.
on:
  schedule:
    - cron: '7 9 * * 1' # Mondays 09:07 UTC
  workflow_dispatch:

permissions:
  contents: read
  # The sweep reports each linter as its own commit status.
  statuses: write

jobs:
  super-linter:
    uses: adanalife/infra/.github/workflows/lint-sweep.yml@main
