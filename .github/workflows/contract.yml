name: contract

# Guards the anti-drift contract bridge (pkg/contract): tripbot is the source of
# truth for the service names / ports / env-var keys the infra cdk8s manifests
# consume, the NATS subjects and envelopes the console reads, and the chat
# command registry it renders. This catches both failure modes — a source
# changed without regenerating, and a generated file hand-edited away from its
# source.
#
# chat-commands.json is generated from pkg/chatbot, which this path filter
# deliberately doesn't cover: a registry edit is caught by the golden test in
# the always-run `test` job instead, rather than making every chatbot PR pull in
# a second gate.
on:
  pull_request:
    paths:
      - 'pkg/contract/**'
      - '.github/workflows/contract.yml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Go toolchain from .tool-versions.
      - uses: jdx/mise-action@v4

      # `go generate` must reproduce every committed JSON byte-for-byte.
      - name: Regenerate the contract files
        run: go generate ./pkg/contract

      - name: Assert the contract files are up to date
        run: |
          if ! git diff --exit-code pkg/contract/; then
            echo "::error::a pkg/contract JSON file is stale — run 'go generate ./pkg/contract' and commit."
            exit 1
          fi

      # The test re-asserts constants == committed JSON (defense in depth, and
      # covers the case where contract.json was hand-edited).
      - name: Test
        run: go test ./pkg/contract/...
