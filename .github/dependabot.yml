# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Bumps carry no user-facing change, so they never need a towncrier
  # changelog fragment. Self-apply skip-changelog so the changelog
  # workflow's existing label escape hatch exempts them — this keeps the
  # enforcement workflow bot-agnostic (survives a future move off Dependabot
  # without a workflow edit). Note: setting `labels` replaces Dependabot's
  # defaults, so the otherwise-automatic dependencies/ecosystem labels are
  # restated here.
  #
  # Every ecosystem here batches its minor and patch bumps into one PR per run.
  # A major is deliberately left out of every non-Actions group so it arrives on
  # its own, where a breaking change is attributable to a single dependency
  # instead of hiding among a dozen safe ones.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
      - skip-changelog
  # The Actions group takes majors too, unlike the others. An action major is
  # normally a runner or Node version bump rather than an API break, so the
  # attributability that keeps majors solo elsewhere buys little here — and
  # holding them out produced a standing queue of one-line PRs nobody merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github_actions
      - skip-changelog
  - package-ecosystem: docker
    directory: infra/docker/tripbot
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
      - skip-changelog
  # The cdk8s CLI and its jsii toolchain. Dependabot has no mise backend, so
  # this is only reachable because the CLI is pinned in package-lock.json
  # rather than cdk8s/.mise.toml. The cdk8s gate re-synths on the bump PR, so a
  # codegen change that would move dist/ fails the PR instead of main.
  - package-ecosystem: npm
    directory: cdk8s
    schedule:
      interval: daily
    groups:
      cdk8s:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - javascript
      - skip-changelog
  # The cdk8s Python layer: the libraries the authoring code imports. The npm
  # entry above covers the CLI half of the same toolchain; without this one the
  # Python half takes no updates at all, security included.
  - package-ecosystem: uv
    directory: cdk8s
    schedule:
      interval: daily
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python
      - skip-changelog
