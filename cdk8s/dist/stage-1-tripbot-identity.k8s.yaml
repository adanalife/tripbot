apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: tripbot
    app.kubernetes.io/part-of: tripbot
  name: tripbot-database-creds
  namespace: stage-1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: SecretStore
  target:
    name: tripbot-database-creds
    template:
      type: Opaque
      data:
        DATABASE_USER: "{{ .user }}"
        DATABASE_PASS: "{{ .password }}"
        DATABASE_DB: "{{ .db }}"
  data:
    - secretKey: user
      remoteRef:
        key: /k8s/postgres/credentials
        property: user
    - secretKey: password
      remoteRef:
        key: /k8s/postgres/credentials
        property: password
    - secretKey: db
      remoteRef:
        key: /k8s/postgres/credentials
        property: db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: tripbot
    app.kubernetes.io/part-of: tripbot
  name: tripbot-twitch-creds
  namespace: stage-1
spec:
  dataFrom:
    - extract:
        key: /k8s/tripbot/twitch-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-parameterstore
  target:
    creationPolicy: Owner
    name: tripbot-twitch-creds
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: tripbot
    app.kubernetes.io/part-of: tripbot
  name: tripbot-discord-alerts-webhook
  namespace: stage-1
spec:
  data:
    - remoteRef:
        key: /k8s/tripbot/discord-alerts-webhook
      secretKey: DISCORD_ALERTS_WEBHOOK
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-parameterstore
  target:
    creationPolicy: Owner
    name: tripbot-discord-alerts-webhook
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: tripbot
    app.kubernetes.io/part-of: tripbot
  name: tripbot-discord-bot-token
  namespace: stage-1
spec:
  data:
    - remoteRef:
        key: /k8s/tripbot/discord-bot-token
      secretKey: DISCORD_BOT_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-parameterstore
  target:
    creationPolicy: Owner
    name: tripbot-discord-bot-token
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: stage-1
spec:
  hard:
    limits.memory: 20Gi
    local-path.storageclass.storage.k8s.io/requests.storage: 40Gi
    pods: "30"
    requests.cpu: "6"
    requests.gpu.intel.com/i915: "3"
    requests.memory: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: app-limits
  namespace: stage-1
spec:
  limits:
    - default:
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
