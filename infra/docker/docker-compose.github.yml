version: '3.7'

services:
  tripbot:
    # Placeholder identity set by the tripbot workflow's job env. Both keys
    # are required:"true" in pkg/config/tripbot, and the seeded oauth_tokens
    # row is keyed on BOT_USERNAME.
    environment:
      - CHANNEL_NAME
      - BOT_USERNAME
    build:
      # pull down cache layers from repo
      cache_from:
        - adanalife/tripbot
